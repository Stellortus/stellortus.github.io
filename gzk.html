
<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>中秋快乐</title>
<style>
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  body {
    margin: 0;
    min-height: 100vh;
    background: linear-gradient(180deg, #0b1a3a 0%, #1a2f5a 60%, #2a4a7a 100%);
    color: #fff;
    font-family: -apple-system, "PingFang SC", "Microsoft YaHei", sans-serif;
    display: flex;
    flex-direction: column;
    align-items: center;
    padding: 30px 20px;
    text-align: center;
  }
  .moon { font-size: 60px; margin-bottom: 10px; animation: float 3s ease-in-out infinite; }
  @keyframes float { 0%,100%{transform:translateY(0)} 50%{transform:translateY(-8px)} }
  h1 { font-size: 22px; font-weight: 500; margin: 6px 0 4px; }
  .sub { font-size: 15px; color: #b8c8e0; margin-bottom: 26px; }
  .btn {
    width: 100%; max-width: 320px;
    padding: 14px;
    margin: 7px 0;
    font-size: 16px;
    border: none;
    border-radius: 14px;
    background: rgba(255,255,255,0.12);
    color: #fff;
    cursor: pointer;
    transition: all 0.2s;
  }
  .btn:active { background: rgba(255,255,255,0.28); transform: scale(0.97); }
  .result {
    display: none;
    margin-top: 26px;
    width: 100%; max-width: 320px;
    background: rgba(255,255,255,0.1);
    border-radius: 18px;
    padding: 22px 16px;
    animation: fadeIn 0.5s ease;
  }
  @keyframes fadeIn { from{opacity:0; transform:translateY(10px)} to{opacity:1; transform:translateY(0)} }
  .mooncake {
    font-family: monospace;
    font-size: 14px;
    line-height: 1.5;
    white-space: pre;
    color: #ffd98a;
    margin-bottom: 16px;
    text-align: left;
    display: inline-block;
  }
  .msg { font-size: 16px; line-height: 1.7; }
  .again {
    margin-top: 18px;
    padding: 10px 22px;
    font-size: 14px;
    border: 1px solid rgba(255,255,255,0.35);
    border-radius: 20px;
    background: transparent;
    color: #fff;
  }
</style>
</head>
<body>

<div class="moon">🌕</div>
<h1>中秋快乐！</h1>
<div class="sub">想吃什么馅的月饼？</div>

<button class="btn" onclick="choose(1)">🥮 豆沙</button>
<button class="btn" onclick="choose(2)">🥮 莲蓉</button>
<button class="btn" onclick="choose(3)">🥮 五仁</button>
<button class="btn" onclick="choose(4)">🥮 蛋黄</button>
<button class="btn" onclick="choose(5)">🥮 蟹黄</button>
<button class="btn" onclick="choose(6)">🥮 郭子慷</button>

<div class="result" id="result">
  <div class="mooncake" id="pic"></div>
  <div class="msg" id="msg"></div>
  <button class="again" onclick="reset()">再选一个</button>
</div>

<script>
const data = {
  1: {
    pic: "      ______\n    /        \\\n   /  ●  ●  ● \\\n  |   豆沙     |\n   \\  ●  ●  ● /\n    \\________/",
    msg: "豆沙馅，甜甜的，像你一样。"
  },
  2: {
    pic: "      ______\n    /        \\\n   /  ○  ○  ○ \\\n  |   莲蓉     |\n   \\  ○  ○  ○ /\n    \\________/",
    msg: "莲蓉馅，细腻温柔，愿你被生活温柔以待。"
  },
  3: {
    pic: "      ______\n    /        \\\n   /  ◆  ●  ▲ \\\n  |   五仁     |\n   \\  ■  ◆  ● /\n    \\________/",
    msg: "五仁馅，什么都有，愿你想要的全都拥有。"
  },
  4: {
    pic: "      ______\n    /        \\\n   /  ●  ●  ● \\\n  |   ●蛋黄●   |\n   \\  ●  ●  ● /\n    \\________/",
    msg: "蛋黄馅，圆圆满满，愿你事事都圆满。"
  },
  5: {
    pic: "      ______\n    /        \\\n   /  ~  ~  ~ \\\n  |   蟹黄     |\n   \\  ~  ~  ~ /\n    \\________/",
    msg: "蟹黄月饼，鲜香满满，愿你每天都有小惊喜。"
  },
  6: {
    pic: "",
    msg: "这个不能吃！（伤心了）"
  }
};

function choose(n) {
  const d = data[n];
  document.getElementById("pic").textContent = d.pic;
  document.getElementById("msg").textContent = d.msg + "\n\n不管你选什么，中秋快乐！";
  document.getElementById("result").style.display = "block";
  document.getElementById("result").scrollIntoView({behavior: "smooth"});
}

function reset() {
  document.getElementById("result").style.display = "none";
  window.scrollTo({top: 0, behavior: "smooth"});
}
</script>

</body>
</html>
